services:
  follica-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: follica-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Follica
      - APP_ENV=production
      - API_PREFIX=/api/v1
      - CONSENT_DB_PATH=/app/backend/data/consent.db
    volumes:
      - follica-consent-data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/status"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  follica-consent-data:
