name: Follica Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Automated Tests & Clinical Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify zero emojis in repository
        run: |
          python -c "
          import os, re, sys
          emoji_pattern = re.compile('[\U00010000-\U0010ffff]', flags=re.UNICODE)
          violations = []
          for root, dirs, files in os.walk('.'):
              if any(skip in root for skip in ['.git', '__pycache__', '.pytest_cache', 'node_modules']):
                  continue
              for f in files:
                  if f.endswith(('.py', '.html', '.md', '.js', '.css', '.json', '.sql', '.yaml', '.yml')):
                      p = os.path.join(root, f)
                      try:
                          content = open(p, 'r', encoding='utf-8').read()
                          matches = emoji_pattern.findall(content)
                          if matches:
                              violations.append(f'{p}: found emojis {set(matches)}')
                      except Exception:
                          pass
          if violations:
              print('FAILURE: Emojis detected in repository:')
              for v in violations:
                  print('  ', v)
              sys.exit(1)
          print('SUCCESS: Zero emojis found across repository.')
          "

      - name: Execute Pytest Suite
        run: |
          python -m pytest backend/tests -v
